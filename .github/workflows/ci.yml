name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Build production container
        run: docker build --tag argos-api:ci .
      - name: Validate production ML runtime
        run: |
          docker run --rm argos-api:ci python -c "import sklearn, lightgbm, catboost; print('ML dependencies imported successfully')"
          docker run --rm argos-api:ci sh -c 'test "$(id -un)" = argos'

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argos_test
          POSTGRES_USER: argos
          POSTGRES_PASSWORD: argos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argos -d argos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://argos:argos@localhost:5432/argos_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Run PostgreSQL integration tests
        run: |
          uv run pytest -m integration -o addopts=-q
          uv run pytest -m integration -o addopts=-q
      - name: Downgrade and verify empty schema
        run: |
          uv run alembic downgrade base
          uv run python - <<'PY'
          import asyncio

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.core.config import get_settings


          async def verify_market_candles_removed() -> None:
              engine = create_async_engine(get_settings().database_url)
              async with engine.connect() as connection:
                  table = await connection.scalar(
                      text("SELECT to_regclass('public.market_candles')")
                  )
              await engine.dispose()
              if table is not None:
                  raise SystemExit("market_candles still exists after downgrade")


          asyncio.run(verify_market_candles_removed())
          PY

